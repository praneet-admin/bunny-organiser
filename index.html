<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mr. Box</title>
<style>
  :root {
    --brand-900: #23155c; --brand-700: #5330d6; --brand-600: #6a48f2; --brand-500: #8466ff;
    --accent-600: #f2b705; --accent-500: #ffd233;
    --mint-600: #12a877; --danger-600: #c9245a;
    --ink-900: #1b1638; --ink-500: #5f5885;
    --font: "Nunito", ui-rounded, "Avenir Next Rounded", "Avenir Next", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink-900: #f4f1ff; --ink-500: #b9b2dc; --mint-600: #2fe3a5; --danger-600: #ff6f9b; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: var(--font); color: var(--ink-900);
    display: flex; align-items: center; gap: 10px; padding: 0 12px 0 8px;
    user-select: none; -webkit-user-select: none; cursor: default;
  }

  /* ---------- Mr. Box ---------- */
  .mascot-wrap { position: relative; flex: none; width: 60px; height: 60px; }
  .mascot {
    width: 100%; height: 100%; -webkit-user-drag: none;
    transform-origin: 50% 90%; animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  body.working .mascot { animation: hop .5s cubic-bezier(.3,0,.4,1) infinite; }
  @keyframes hop {
    0%,100% { transform: translateY(0) scale(1.05, .94); }
    40%     { transform: translateY(-7px) scale(.97, 1.04) rotate(-4deg); }
    65%     { transform: translateY(-7px) scale(.97, 1.04) rotate(4deg); }
  }
  body.happy .mascot { animation: cheer .8s ease-out 2; }
  @keyframes cheer { 0%,100% { transform: none; } 35% { transform: translateY(-9px) rotate(-10deg); } 70% { transform: translateY(-9px) rotate(10deg); } }
  .badge {
    position: absolute; top: 0; right: -2px; min-width: 19px; height: 19px; padding: 0 5px;
    border-radius: 999px; background: #3a78e0; color: #fff;
    font: 900 11px/19px var(--font); text-align: center;
    box-shadow: 0 0 0 2px rgba(255,255,255,.85); display: none;
  }
  @media (prefers-color-scheme: dark) { .badge { box-shadow: 0 0 0 2px rgba(30,24,60,.9); } }
  .badge.show { display: block; animation: pop .3s ease-out; }
  @keyframes pop { from { transform: scale(.4); } 70% { transform: scale(1.15); } to { transform: none; } }

  /* ---------- text ---------- */
  .text { flex: 1; min-width: 0; line-height: 1.25; }
  .title { font-weight: 900; font-size: 13.5px; letter-spacing: .01em; }
  .status {
    font-weight: 700; font-size: 12.5px; color: var(--ink-500); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status.ok { color: var(--mint-600); }
  .status.err { color: var(--danger-600); }
  .text.clickable { cursor: pointer; }
  .text.clickable:hover .status { text-decoration: underline; }

  /* ---------- button ---------- */
  .go {
    flex: none; padding: 8px 14px; font: 900 13.5px var(--font); color: var(--brand-900);
    background: var(--accent-500); border: none; border-radius: 12px; cursor: pointer;
    box-shadow: 0 3px 0 var(--accent-600); transition: transform .08s, box-shadow .08s, filter .15s;
  }
  .go:hover { filter: brightness(1.05); }
  .go:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-600); }
  .go:disabled { cursor: progress; filter: saturate(.35); transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-600); }
  .go:focus-visible { outline: 2px solid var(--brand-500); outline-offset: 2px; }

  /* ---------- close (appears on hover, like a notification) ---------- */
  .close {
    position: absolute; top: 4px; left: 4px; width: 18px; height: 18px; border-radius: 50%;
    border: none; padding: 0; cursor: pointer; opacity: 0; transition: opacity .15s;
    background: rgba(120, 110, 160, .55); color: #fff; font: 700 12px/18px system-ui; text-align: center;
  }
  body:hover .close { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <button class="close" id="close" title="Hide (reopen from the Dock)">×</button>
  <div class="mascot-wrap">
    <img class="mascot" src="mrbox.png" alt="Mr. Box">
    <span class="badge" id="badge"></span>
  </div>
  <div class="text" id="text">
    <div class="title">Mr. Box</div>
    <div class="status" id="status">Peeking at your folders…</div>
  </div>
  <button class="go" id="go" title="Option-click to preview without moving">Organise</button>

<script>
  const $ = id => document.getElementById(id);
  const bridge = msg => window.webkit?.messageHandlers?.bot?.postMessage(msg);
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  let waiting = 0, moved = 0, preview = false, lastError = '', projects = new Set(), clickOpens = false;

  function status(text, kind = '') {
    $('status').textContent = text;
    $('status').className = 'status' + (kind ? ' ' + kind : '');
  }
  function badge(n) {
    $('badge').textContent = n > 99 ? '99+' : n;
    $('badge').classList.toggle('show', n > 0);
  }
  function setClickOpens(on) { clickOpens = on; $('text').classList.toggle('clickable', on); }

  // Called by the app for each line the organiser prints.
  window.onLine = line => {
    if (line.startsWith('WAITING\t')) { waiting++; return; }
    if (line.startsWith('Skipping')) { lastError = 'macOS blocked a folder — allow access in Settings'; return; }
    const m = line.match(/^(.*?)\s+->\s+(.*)$/);
    if (!m) { if (line.trim()) lastError = line.trim(); return; }
    moved++;
    const file = m[1].split('/').pop();
    const parts = m[2].split('/');
    const where = m[2].includes('_To_Review') ? 'To Review'
      : m[2].startsWith('Personal') ? 'Personal'
      : m[2].startsWith('Installers') ? 'Installers'
      : (parts[2] || 'project');
    projects.add(where);
    status(`${preview ? 'Would file' : 'Filed'} ${file} → ${where}`);
    if (!preview) badge(Math.max(waiting - moved, 0));
  };

  // Called by the app when the organiser exits.
  window.onDone = (kind, code) => {
    if (kind === 'list') {
      badge(waiting);
      setClickOpens(false);
      if (lastError) status(lastError, 'err');
      else if (waiting) status(`${plural(waiting, 'new file')} waiting`);
      else status('All tidy ✨', 'ok');
      return;
    }
    document.body.classList.remove('working');
    $('go').disabled = false;
    $('go').textContent = 'Organise';
    if (code !== 0) { status(lastError || 'Something went wrong', 'err'); return; }
    if (!moved) { status('Nothing new to file', 'ok'); badge(0); return; }
    const into = [...projects].slice(0, 2).join(', ') + (projects.size > 2 ? ` +${projects.size - 2}` : '');
    if (preview) {
      status(`Plan: ${plural(moved, 'file')} → ${into}`);
    } else {
      status(`Done! ${plural(moved, 'file')} → ${into} · open`, 'ok');
      badge(0);
      setClickOpens(true);
      document.body.classList.add('happy');
      setTimeout(() => document.body.classList.remove('happy'), 1700);
      setTimeout(() => { setClickOpens(false); refresh(); }, 20000);
    }
  };

  $('go').addEventListener('click', e => {
    preview = e.altKey;
    moved = 0; lastError = ''; projects = new Set();
    setClickOpens(false);
    $('go').disabled = true;
    $('go').textContent = preview ? 'Planning…' : 'Sorting…';
    document.body.classList.add('working');
    status(preview ? 'Planning where things go…' : 'Tidying up your folders…');
    bridge({ action: 'organise', preview });
  });
  $('text').addEventListener('click', () => { if (clickOpens) bridge({ action: 'open' }); });
  $('close').addEventListener('click', () => bridge({ action: 'hide' }));

  window.refresh = () => {
    if (document.body.classList.contains('working') || clickOpens) return;
    waiting = 0; lastError = '';
    bridge({ action: 'list' });
  };
  if (window.webkit?.messageHandlers?.bot) refresh(); else status('Open me from the app');
</script>
</body>
</html>
